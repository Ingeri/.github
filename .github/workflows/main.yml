name: Refresh profile stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "profile/README.md"
      - "scripts/update_stats.py"
      - ".github/workflows/update-stats.yml"

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh public GitHub metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ingeri
        run: python scripts/update_stats.py

      - name: Commit updated profile metrics
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): refresh GitHub stats"
          file_pattern: profile/README.md
